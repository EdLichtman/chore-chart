[project]
name = "chores-almanac"
version = "1.0.0"
description = "Generate yearly chore almanac from YAML with seasonal organization"
requires-python = ">=3.8"
dependencies = [
    "PyYAML>=6.0",
    "python-docx>=0.8.11",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
