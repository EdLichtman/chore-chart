<div class="card">
  <div class="card-body">
    <h5 class="card-title mb-4">Import Chore List</h5>

    <div
      class="drop-zone"
      [class.active]="dragActive"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
    >
      <div class="drop-content">
        <p class="mb-3">
          <strong>Drag and drop your chores.json file here</strong>
        </p>
        <p class="text-muted mb-3">or</p>
        <label class="btn btn-primary">
          <span *ngIf="!isLoading">Choose File</span>
          <span *ngIf="isLoading">
            <span
              class="spinner-border spinner-border-sm me-2"
              role="status"
              aria-hidden="true"
            ></span>
            Loading...
          </span>
          <input
            type="file"
            accept=".json"
            (change)="onFileSelected($event)"
            [disabled]="isLoading"
            style="display: none"
          />
        </label>
      </div>
    </div>

    <div class="alert alert-danger mt-3" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>
  </div>
</div>
