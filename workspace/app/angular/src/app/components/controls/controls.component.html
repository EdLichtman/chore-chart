<div class="controls-bar mb-4">
  <div class="btn-group" role="group">
    <button type="button" class="btn btn-outline-secondary" (click)="previousWeek()">
      ← Previous Week
    </button>
    <button type="button" class="btn btn-outline-secondary" (click)="nextWeek()">
      Next Week →
    </button>
  </div>

  <button type="button" class="btn btn-primary" (click)="exportChores()">
    📥 Export Chores
  </button>

  <button
    type="button"
    class="btn btn-outline-secondary"
    (click)="toggleViewMode()"
  >
    {{ viewMode === '1week' ? '📅 4 Weeks' : '📅 1 Week' }}
  </button>

  <button
    type="button"
    class="btn btn-outline-secondary"
    (click)="printPage()"
  >
    🖨️ Print
  </button>
</div>
