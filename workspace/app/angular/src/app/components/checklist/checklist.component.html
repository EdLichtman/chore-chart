<div class="checklist">

  <!-- Daily Chores Table -->
  <div *ngIf="checklistData.daily.length > 0" class="section mb-5">
    <h2>Daily</h2>
    <div class="table-responsive">
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Chore</th>
            <th *ngFor="let day of weekDays" class="text-center">{{ day }}</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let chore of checklistData.daily">
            <td>
              <strong>{{ chore.name }}</strong>
              <div *ngIf="chore.notes.length > 0" class="notes">
                <ul class="mb-0">
                  <li *ngFor="let note of chore.notes">{{ note }}</li>
                </ul>
              </div>
            </td>
            <td *ngFor="let dayIndex of [0,1,2,3,4,5,6]" class="text-center">
              <div class="form-check d-flex justify-content-center">
                <input
                  class="form-check-input"
                  type="checkbox"
                  [id]="'daily-' + chore.id + '-' + dayIndex"
                  [checked]="getDailyCheckboxes(chore.id)[dayIndex]"
                  (change)="toggleDailyCheckbox(chore.id, dayIndex)"
                />
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Categories Grid -->
  <div *ngIf="checklistData.categories.length > 0" class="row g-4 mb-4 categories-grid" [style.--print-cols]="printColumns">
    <div *ngFor="let cat of checklistData.categories" [class]="'section ' + categoryColClass">
      <h3 class="category-heading">{{ cat.label }}</h3>
      <div class="chore-list">

        <div *ngFor="let chore of cat.chores" class="chore-item">
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              [id]="'chore-' + chore.id"
            />
            <label class="form-check-label" [for]="'chore-' + chore.id">
              <span class="chore-name">
                <strong>{{ chore.name }}</strong>
                <span *ngIf="chore.dayConfigurable"> — day: <span class="day-blank"></span></span>
              </span>
              <span *ngIf="isPending(chore)" class="chore-sub">
                <span class="alert-badge pending"><i class="fa-solid fa-question"></i></span>
                pending
                <span class="alert-badge pending trailing"><i class="fa-solid fa-question"></i></span>
              </span>
              <span *ngIf="!isPending(chore) && getLastAlignedDisplay(chore)" class="chore-sub">
                <ng-container *ngIf="isPastDue(chore) && isCurrentOrPastWeek">
                  <span class="alert-badge overdue"><i class="fa-solid fa-exclamation"></i></span>
                </ng-container>
                {{ getLastAlignedDisplay(chore) }}
                <ng-container *ngIf="isPastDue(chore) && isCurrentOrPastWeek">
                  <span class="alert-badge overdue trailing"><i class="fa-solid fa-exclamation"></i></span>
                </ng-container>
              </span>
              <span *ngIf="chore.requirements.length > 0" class="chore-sub">
                <i class="fa-solid fa-list-check requirements-indicator" title="See requirements page"></i>
              </span>
            </label>
          </div>

          <div *ngIf="chore.notes.length > 0" class="ms-3">
            <div *ngFor="let note of chore.notes; let i = index" class="form-check">
              <input class="form-check-input" type="checkbox" [id]="'note-' + chore.id + '-' + i" />
              <label class="form-check-label" [for]="'note-' + chore.id + '-' + i">{{ note }}</label>
            </div>
          </div>
        </div>
      </div>
      <div class="additional-notes">
        <p class="additional-notes-label">Additional Notes</p>
      </div>
    </div>
  </div>

  <!-- On Deck (hidden in 4-week view) -->
  <div *ngIf="checklistData.onDeck.length > 0 && !isMultiWeekView" class="section mb-5 on-deck">
    <h2>On Deck</h2>
    <ul class="reference-list">
      <li *ngFor="let chore of checklistData.onDeck">
        <strong>{{ chore.name }}</strong>
        <span class="date" *ngIf="getDueDate(chore)">
          ({{ formatDate(getDueDate(chore)!) }})
        </span>
      </li>
    </ul>
  </div>

  <!-- Empty State -->
  <div *ngIf="checklistData.daily.length === 0 && checklistData.categories.length === 0" class="alert alert-info">
    No chores scheduled for this week.
  </div>

</div>
