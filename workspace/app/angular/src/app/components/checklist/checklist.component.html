<div class="checklist">

  <!-- Daily Chores Table -->
  <div *ngIf="checklistData.daily.length > 0" class="section mb-5">
    <h2>Daily</h2>
    <div class="table-responsive">
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Chore</th>
            <th *ngFor="let day of weekDays" class="text-center">{{ day }}</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let chore of checklistData.daily">
            <td>
              <strong>{{ chore.name }}</strong>
              <div *ngIf="chore.notes.length > 0" class="notes">
                <ul class="mb-0">
                  <li *ngFor="let note of chore.notes">{{ note }}</li>
                </ul>
              </div>
            </td>
            <td *ngFor="let dayIndex of [0,1,2,3,4,5,6]" class="text-center">
              <div class="form-check d-flex justify-content-center">
                <input
                  class="form-check-input"
                  type="checkbox"
                  [id]="'daily-' + chore.id + '-' + dayIndex"
                  [checked]="getDailyCheckboxes(chore.id)[dayIndex]"
                  (change)="toggleDailyCheckbox(chore.id, dayIndex)"
                />
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Categories Grid -->
  <div *ngIf="checklistData.categories.length > 0" class="row g-1 mb-2 categories-grid" [style.--print-cols]="printColumns">
    <div *ngFor="let cat of checklistData.categories" [class]="'section ' + categoryColClass">
      <h3 class="category-heading">{{ cat.label }}</h3>
      <div class="chore-list">

        <div *ngFor="let chore of getNonOverdueChores(cat.chores)" class="chore-item">
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              [id]="'chore-' + chore.id"
            />
            <label class="form-check-label" [for]="'chore-' + chore.id">
              <span class="chore-name">
                <strong>{{ chore.name }}</strong>
              </span>
              <span *ngIf="chore.requirements.length > 0" class="chore-sub see-manual">
                <strong><em>(See Manual)</em></strong>
              </span>
              <span *ngIf="isPending(chore)" class="chore-sub">pending</span>
              <span *ngIf="!isPending(chore) && getLastAlignedDisplay(chore)" class="chore-sub">
                {{ getLastAlignedDisplay(chore) }}
              </span>
            </label>
          </div>

          <ul *ngIf="chore.notes.length > 0" class="chore-notes">
            <li *ngFor="let note of chore.notes" class="chore-note">{{ note }}</li>
          </ul>
        </div>
      </div>

      <div *ngIf="getOverdueChores(cat.chores).length > 0" class="overdue-section">
        <h4 class="overdue-heading">Overdue</h4>
        <div class="chore-list">
          <div *ngFor="let chore of getOverdueChores(cat.chores)" class="chore-item">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                [id]="'overdue-' + chore.id"
              />
              <label class="form-check-label overdue-label" [for]="'overdue-' + chore.id">
                <span class="chore-name"><strong>{{ chore.name }}</strong></span>
                <span *ngIf="getLastAlignedDisplay(chore)" class="chore-sub">
                  {{ getLastAlignedDisplay(chore) }}
                </span>
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- On Deck (hidden in 4-week view) -->
  <div *ngIf="checklistData.onDeck.length > 0 && !isMultiWeekView" class="section mb-5 on-deck">
    <h2>On Deck</h2>
    <ul class="reference-list">
      <li *ngFor="let chore of checklistData.onDeck">
        <strong>{{ chore.name }}</strong>
        <span class="date" *ngIf="getDueDate(chore)">
          ({{ formatDate(getDueDate(chore)!) }})
        </span>
      </li>
    </ul>
  </div>

  <!-- Empty State -->
  <div *ngIf="checklistData.daily.length === 0 && checklistData.categories.length === 0" class="alert alert-info">
    No chores scheduled for this week.
  </div>

</div>
