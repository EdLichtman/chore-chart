services:
  angular:
    build:
      context: .
      dockerfile: Dockerfile.angular
    container_name: chore-angular
    ports:
      - "4200:80"
    networks:
      - chore-network

  nginx:
    image: nginx:alpine
    container_name: chore-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-empty.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - chore-network
    depends_on:
      - angular

networks:
  chore-network:
    driver: bridge
